<!DOCTYPE html>
<html>

<head>

    <title>Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body>

    <!-- Navbar -->

    <nav class="bg-blue-500 p-4">

        <a href="index.html" class="text-white mr-4">
            Home
        </a>

        <a href="about.html" class="text-white mr-4">
            About
        </a>

        <a href="contact.html" class="text-white mr-4">
            Contact
        </a>

        <a href="signup.html" class="text-white mr-4">
            Sign Up
        </a>

        <a href="signin.html" class="text-white">
            Sign In
        </a>

    </nav>


    <!-- Sign Up -->

    <section class="p-10">

        <h1 class="text-3xl font-bold">
            Create Account
        </h1>

        <p class="mt-2">
            Fill the form to create an account.
        </p>


        <form class="mt-6">


            <label>
                Full Name
            </label>

            <br>

            <input
                type="text"
                required
                class="border p-2 mt-2">

            <br><br>


            <label>
                Email
            </label>

            <br>

            <input
                type="email"
                required
                class="border p-2 mt-2">

            <br><br>


            <label>
                Password
            </label>

            <br>

            <input
                type="password"
                required
                minlength="8"
                class="border p-2 mt-2">

            <br><br>


            <label>
                Confirm Password
            </label>

            <br>

            <input
                type="password"
                required
                class="border p-2 mt-2">

            <br><br>


            <input
                type="checkbox"
                required>

            <label>
                I agree to the terms.
            </label>

            <br><br>


            <button
                type="submit"
                class="bg-blue-500 text-white p-2">

                Create Account

            </button>

        </form>


        <p class="mt-5">

            Already have an account?

            <a href="signin.html" class="text-blue-500">
                Sign In
            </a>

        </p>

    </section>


    <!-- Footer -->

    <footer class="bg-gray-800 text-white text-center p-5">

        <p>
            My Website
        </p>

        <p>
            © 2026 All Rights Reserved
        </p>

    </footer>

</body>

</html>
